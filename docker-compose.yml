services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: chatbot
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot_dev_only
    ports:
      - "5432:5432"
    volumes:
      - chatbot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  chatbot-postgres-data:
